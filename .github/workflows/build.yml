name: Build
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir app && unzip -q app.zip -d app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: cd app && npm install && npx cap add android && npx cap sync android
      - name: Signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "build-bot"
            git config user.email "build-bot@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add signing key"
            git push
          fi
          cp debug.keystore ~/.android/debug.keystore
      - run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/android/app/build/outputs/apk/debug/app-debug.apk sooqwoow-add-products.apk
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "apk-${{ github.run_number }}", files: sooqwoow-add-products.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive app.zip -DestinationPath app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd app; npm install; npm run dist
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "win-${{ github.run_number }}", files: app/dist/*.exe }
